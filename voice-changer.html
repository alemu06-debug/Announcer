<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>החלפת קול</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#1b1f33;--muted:#6b7090;--accent:#4f46e5;--accent2:#7c3aed;--accent-t:#fff;--rec:#e11d48;--line:#e1e3f0;--soft:#eceefb;--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--text:#eef0fb;--muted:#9aa0c3;--accent:#8b85ff;--accent2:#b18cff;--accent-t:#0f1220;--rec:#ff6b88;--line:#2a2f4d;--soft:#242949;--ok:#86efac;--okbg:#14301f;--warn:#fcd34d;--warnbg:#3a2e0b;--bad:#fca5a5;--badbg:#3b1414}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--text:#eef0fb;--muted:#9aa0c3;--accent:#8b85ff;--accent2:#b18cff;--accent-t:#0f1220;--rec:#ff6b88;--line:#2a2f4d;--soft:#242949;--ok:#86efac;--okbg:#14301f;--warn:#fcd34d;--warnbg:#3a2e0b;--bad:#fca5a5;--badbg:#3b1414}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:18px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:14px 16px 28px}
header{text-align:center;padding:10px 0 12px}
header h1{font-size:24px;margin:0}
.chip{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:99px;font-size:14px;background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(79,70,229,.08)}
.micwrap{display:flex;flex-direction:column;align-items:center}
#mic{width:min(52vw,190px);height:min(52vw,190px);border-radius:50%;border:0;background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--accent-t);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:700;box-shadow:0 10px 30px rgba(79,70,229,.35);touch-action:manipulation;-webkit-appearance:none;font-family:inherit;padding:10px;text-align:center}
#mic svg{width:52px;height:52px}
#mic.rec{background:linear-gradient(145deg,var(--rec),#f97316);color:#fff;animation:p 1.1s infinite;box-shadow:0 0 0 10px rgba(225,29,72,.18)}
#mic.busy{opacity:.6;cursor:wait}
@keyframes p{50%{transform:scale(1.05)}}
#state{margin-top:14px;color:var(--muted);min-height:24px;font-size:16px;text-align:center}
#bar{width:100%;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rec),#f97316)}
#bar[hidden]{display:none}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;min-height:56px;touch-action:manipulation;padding:12px;font-size:18px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--text);cursor:pointer;font-family:inherit}
.row button.p{background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--accent-t);border:0;font-weight:700;flex:2}
.row button[hidden]{display:none}
.row button:disabled{opacity:.5}
.lbl{display:block;color:var(--muted);font-size:14px;margin:0 0 8px}
details summary{cursor:pointer;color:var(--muted);font-size:16px}
.opts{margin-top:12px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:16px}
.chk input{width:22px;height:22px;flex:none}
input[type=url]{width:100%;font-size:16px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;direction:ltr;text-align:left}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 14px}
</style>
</head>
<body>
<main>
<header><h1>🎙️ כריזה בהחלפת קול</h1><div id="chip" class="chip">מוכן</div></header>

<div class="card micwrap">
  <button id="mic" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    <span id="miclbl">לחצו כדי להקליט</span>
  </button>
  <div id="bar" hidden><i></i></div>
  <div id="state">לחצו, אמרו משפט קצר עם השם, ולחצו שוב לסיום</div>
</div>

<div class="card">
  <div class="row" style="margin-top:0">
    <button class="p" id="again" type="button" disabled>🔁 השמע שוב</button>
    <button id="orig" type="button" disabled>ההקלטה המקורית</button>
  </div>
</div>

<div class="card">
  <details id="settings">
    <summary>הגדרות</summary>
    <div class="opts">
      <label class="chk"><input id="noise" type="checkbox"> סינון רעשי רקע (מתאים למקום רועש, לוקח קצת יותר זמן)</label>
      <label class="lbl" for="worker">כתובת השירות (Cloudflare Worker)</label>
      <input id="worker" type="url" placeholder="https://....workers.dev" autocomplete="off" spellcheck="false">
      <div class="note">ההקלטה נשלחת דרך השירות ל-ElevenLabs כדי להחליף את הקול, ולא נשמרת בדף. ההקלטה מוגבלת ל-15 שניות.</div>
    </div>
  </details>
</div>
</main>

<script>
(function(){
  // Public address of the Cloudflare Worker, not a secret. The ElevenLabs key stays in the Worker.
  var WORKER_URL='https://announcer-token.eyasualemu0.workers.dev';
  var MAX_MS=15000;   // longest recording
  var MIN_MS=600;     // shorter than this is treated as an accidental tap
  var LS='announcer-voice-changer-v1';

  var $=function(i){return document.getElementById(i)};
  var settings={noise:false,worker:''};
  try{var s=JSON.parse(localStorage.getItem(LS)||'{}');for(var k in s)if(k in settings)settings[k]=s[k]}catch(e){}
  function save(){try{localStorage.setItem(LS,JSON.stringify(settings))}catch(e){}}
  function workerUrl(){return (settings.worker||WORKER_URL||'').trim().replace(/\/+$/,'')}
  function setState(t){$('state').textContent=t}
  function setChip(cls,t){$('chip').className='chip '+cls;$('chip').textContent=t}

  // ---------- Audio playback ----------
  // One shared <audio> element, unlocked by the first tap, so iPhone allows playing it after the upload finishes.
  var player=new Audio();player.preload='auto';
  var unlocked=false,silent=null;
  function silentWav(){
    var n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b);
    function w(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  }
  function unlockAudio(){
    if(unlocked)return;
    unlocked=true;
    try{silent=silent||silentWav();player.src=silent;var p=player.play();if(p&&p.catch)p.catch(function(){unlocked=false})}catch(e){unlocked=false}
  }
  function stopAudio(){try{player.pause()}catch(e){}}
  function play(url,doneText){
    stopAudio();
    player.src=url;
    player.onended=function(){setState(doneText||'מוכן')};
    setState('משמיע...');
    var p=player.play();
    if(p&&p.catch)p.catch(function(e){setState(e&&e.name==='NotAllowedError'?'הדפדפן חסם את ההשמעה. לחצו "השמע שוב".':'לא ניתן להשמיע את הקול שהתקבל.')});
  }

  // ---------- Recording ----------
  var stream=null,rec=null,chunks=[],startedAt=0,maxTimer=null,tick=null,busy=false;
  var resultUrl=null,origUrl=null;
  function pickType(){
    if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';
    var types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    for(var i=0;i<types.length;i++)if(MediaRecorder.isTypeSupported(types[i]))return types[i];
    return '';
  }
  function releaseMic(){
    // Closing the microphone lets iPhone switch back to the loudspeaker for playback.
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  }
  function setRecording(on){
    $('mic').classList.toggle('rec',on);
    $('miclbl').textContent=on?'מקליט... (לחצו לסיום)':'לחצו כדי להקליט';
    var b=$('bar');b.hidden=!on;b.firstChild.style.width='0';
    clearInterval(tick);clearTimeout(maxTimer);
    if(on){
      tick=setInterval(function(){b.firstChild.style.width=Math.min(100,(Date.now()-startedAt)/MAX_MS*100)+'%'},100);
      maxTimer=setTimeout(stopRecording,MAX_MS);
    }
  }
  function setBusy(on){busy=on;$('mic').classList.toggle('busy',on);$('mic').disabled=on}
  function startRecording(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
      setState('הדפדפן הזה לא תומך בהקלטה. נסו Chrome או Safari מעודכן.');return;
    }
    if(!workerUrl()){setChip('bad','לא הוגדרה כתובת שירות');setState('יש להגדיר כתובת שירות בהגדרות.');return}
    stopAudio();setBusy(true);setState('מבקש גישה למיקרופון...');
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(s){
      stream=s;chunks=[];
      var type=pickType();
      try{rec=type?new MediaRecorder(s,{mimeType:type}):new MediaRecorder(s)}catch(e){rec=new MediaRecorder(s)}
      rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
      rec.onstop=onRecorded;
      rec.start();startedAt=Date.now();
      setBusy(false);setRecording(true);setState('מקליט – אמרו את המשפט עם השם');
    }).catch(function(e){
      setBusy(false);releaseMic();
      setState(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'אין הרשאה למיקרופון. יש לאשר גישה למיקרופון בדפדפן.':'לא ניתן לפתוח את המיקרופון.');
    });
  }
  function stopRecording(){
    if(rec&&rec.state!=='inactive'){setRecording(false);setBusy(true);setState('מסיים הקלטה...');rec.stop()}
  }
  function onRecorded(){
    var ms=Date.now()-startedAt,type=(rec&&rec.mimeType)||(chunks[0]&&chunks[0].type)||'audio/webm';
    rec=null;releaseMic();setBusy(false);
    var blob=new Blob(chunks,{type:type});chunks=[];
    if(ms<MIN_MS||!blob.size){setState('ההקלטה קצרה מדי. נסו שוב.');return}
    if(origUrl)URL.revokeObjectURL(origUrl);
    origUrl=URL.createObjectURL(blob);$('orig').disabled=false;
    convert(blob);
  }

  // ---------- Voice changer ----------
  function errorText(j,status){
    var d=(j&&j.detail)||'',e=(j&&j.error)||'';
    if(e==='origin-not-allowed')return 'השירות לא מאשר את הכתובת של הדף הזה.';
    if(e==='not-configured')return 'השירות לא מוגדר: חסר מפתח ElevenLabs ב-Cloudflare.';
    if(e==='too-large')return 'ההקלטה ארוכה מדי.';
    if(/quota|credit/i.test(d))return 'נגמרה המכסה בחשבון ElevenLabs.';
    if(j&&j.status===401)return 'מפתח ElevenLabs לא תקין.';
    if(e==='elevenlabs-error')return 'ElevenLabs החזיר שגיאה ('+(j.status||'')+(d?' '+d:'')+').';
    return 'שגיאה בשירות ('+status+').';
  }
  function convert(blob){
    setBusy(true);setState('מחליף קול...');setChip('','מעבד...');
    var url=workerUrl()+'/voice-changer'+(settings.noise?'?noise=1':'');
    fetch(url,{method:'POST',body:blob,headers:{'Content-Type':blob.type.split(';')[0]||'application/octet-stream'},cache:'no-store'}).then(function(r){
      if(!r.ok)return r.json().catch(function(){return null}).then(function(j){throw new Error(errorText(j,r.status))});
      return r.blob();
    }).then(function(out){
      if(!out.size)throw new Error('התקבלה תשובה ריקה.');
      if(resultUrl)URL.revokeObjectURL(resultUrl);
      resultUrl=URL.createObjectURL(out);
      $('again').disabled=false;
      setChip('ok','✓ הקול הוחלף');
      play(resultUrl,'מוכן');
    }).catch(function(e){
      var msg=(e&&e.message&&!/fetch|network|load failed/i.test(e.message))?e.message:'אין חיבור לשירות. בדקו את האינטרנט.';
      setChip('bad','לא הצליח');
      setState(msg+' אפשר להשמיע את ההקלטה המקורית.');
    }).finally(function(){setBusy(false)});
  }

  // ---------- Wiring ----------
  $('mic').onclick=function(){
    unlockAudio();
    if(busy)return;
    if(rec&&rec.state==='recording'){stopRecording();return}
    startRecording();
  };
  $('again').onclick=function(){unlockAudio();if(resultUrl)play(resultUrl,'מוכן')};
  $('orig').onclick=function(){unlockAudio();if(origUrl)play(origUrl,'מוכן')};
  $('noise').checked=!!settings.noise;
  $('noise').onchange=function(){settings.noise=this.checked;save()};
  $('worker').value=workerUrl();
  $('worker').onchange=function(){settings.worker=this.value.trim();save();setChip('','מוכן')};
  if(!workerUrl())setChip('warn','לא הוגדרה כתובת שירות');
})();
</script>
</body>
</html>
